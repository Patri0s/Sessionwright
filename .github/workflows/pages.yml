name: pages

# The small web page behind "Copy link to this connection": an https link opens from any program (a chat, a wiki, an
# e-mail) and the page hands it to the app as a sessionwright:// link.
on:
  push:
    branches: [master]
    paths: ['site/**', 'docs/images/logo.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: cp docs/images/logo.png site/logo.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
