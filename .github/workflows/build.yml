name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      # Starts the built app and opens its windows: catches errors that only show with a window on screen.
      - name: Start-up smoke test
        shell: powershell
        run: ./tests/smoke.ps1 -Exe src/Sessionwright/bin/Release/net10.0-windows/Sessionwright.exe -OutDir smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test
          path: smoke
