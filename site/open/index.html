<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nothing but this page's own script, picture and inline style: the server address in the link never leaves the browser -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Open in Sessionwright</title>
<link rel="icon" href="../logo.png">
<style>
  :root { color-scheme: light dark; --bg: #f3f3f3; --card: #ffffff; --text: #1b1b1b; --muted: #5f5f5f; --accent: #1f6feb; --on-accent: #ffffff; --line: #e1e1e1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1c; --card: #272727; --text: #f3f3f3; --muted: #a8a8a8; --accent: #3aa2f5; --on-accent: #0b1624; --line: #3a3a3a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
         font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 32px; text-align: center; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 20px; font-weight: 600; margin: 16px 0 4px; }
  #server { margin: 0 0 20px; color: var(--muted); word-break: break-all; }
  a.button { display: inline-block; padding: 8px 20px; border-radius: 6px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 600; }
  #help { margin: 24px 0 0; color: var(--muted); font-size: 13px; }
  #help a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="../logo.png" alt="">
  <h1 id="title">Opening Sessionwright…</h1>
  <p id="server"></p>
  <a id="open" class="button" href="#" hidden>Open in Sessionwright</a>
  <p id="help" hidden><span id="help-text">Nothing happened? Sessionwright may not be installed on this PC.</span>
    <a id="download" href="https://github.com/Patri0s/Sessionwright/releases/latest">Download Sessionwright</a></p>
</main>
<script src="open.js"></script>
</body>
</html>
