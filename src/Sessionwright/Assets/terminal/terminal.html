<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/*XTERM_CSS*/
/* Cascadia Mono with the Nerd Font icons (prompts such as Oh My Posh draw with them), brought along: it need not be
   installed. Served by Sessionwright (SshWindow), all its weights in one file. */
@font-face { font-family: "Sessionwright Nerd"; src: url("https://terminal.sessionwright.invalid/font.woff2") format("woff2"); font-weight: 200 700; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg, #1c1c1c); }
/* Room around the text: it does not start at the window's edge. */
#terminal { position: absolute; inset: 8px 4px 6px 14px; transition: opacity .2s; }
/* An ended session: still readable, plainly no longer live. */
body.ended #terminal { opacity: .55; }
/* A word in the corner that something happened (copied): gone by itself. */
#note { position: absolute; right: 22px; bottom: 12px; padding: 4px 11px; border-radius: 6px; pointer-events: none;
  font: 12px "Segoe UI Variable Text", "Segoe UI", sans-serif; color: var(--fg, #ddd); background: var(--note, rgba(90, 90, 90, .9));
  opacity: 0; transition: opacity .15s; }
#note.on { opacity: 1; }
/* A thin scroll bar in the window's own shade, without arrows, there only while the pointer is over the terminal. */
.xterm .xterm-viewport::-webkit-scrollbar { width: 12px; }
.xterm .xterm-viewport::-webkit-scrollbar-button { display: none; }
.xterm .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
.xterm .xterm-viewport::-webkit-scrollbar-thumb { background-color: transparent; border: 4px solid transparent; border-radius: 6px; background-clip: content-box; }
.xterm:hover .xterm-viewport::-webkit-scrollbar-thumb { background-color: var(--thumb, rgba(255, 255, 255, .28)); }
.xterm .xterm-viewport::-webkit-scrollbar-thumb:hover { border-width: 3px; }
.xterm .xterm-selection div { border-radius: 2px; }
</style>
</head>
<body>
<div id="terminal"></div>
<div id="note"></div>
<script>/*XTERM_JS*/</script>
<script>/*FIT_JS*/</script>
<script>
// The page of a terminal window: xterm.js draws what ssh prints and hands over what is typed. Sessionwright (SshWindow)
// is on the other side of chrome.webview: {o} output (base64), {p} text to paste, {theme, thumb, fontSize}, {focus} come
// in; {t:'in'}, {t:'size'}, {t:'copy'}, {t:'paste'}, {t:'font'}, {t:'link'}, {t:'files'}, {t:'ready'} and the keys
// Sessionwright acts on (full screen, switching sessions) go out.
const DefaultSize = 14;
// A Nerd Font of the user's own first, then the one brought along, then what Windows has.
const Own = '"CaskaydiaCove Nerd Font Mono", "CaskaydiaMono Nerd Font", "Cascadia Mono NF"';
const Plain = '"Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace';
const term = new Terminal({
  fontFamily: Own + ', ' + Plain, fontSize: DefaultSize,
  // Light text on a dark page is drawn heavier than dark on light: the weight comes with the theme (see SshWindow).
  fontWeight: '400', fontWeightBold: '600', lineHeight: 1.15,
  cursorStyle: 'bar', cursorWidth: 2, cursorBlink: true, cursorInactiveStyle: 'outline',
  scrollback: 10000,
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('terminal'));
const send = message => chrome.webview.postMessage(message);
// The font brought along, once it is there: the terminal measures its cells anew when the family changes.
document.fonts.load(DefaultSize + 'px "Sessionwright Nerd"').then(faces => {
  send({ t: 'nerd', n: faces.length });
  if (faces.length === 0) return;
  term.options.fontFamily = Own + ', "Sessionwright Nerd", ' + Plain;
  fit.fit();
}).catch(() => send({ t: 'nerd', n: 0 }));
term.onData(data => send({ t: 'in', d: data }));
term.onResize(size => send({ t: 'size', c: size.cols, r: size.rows }));
new ResizeObserver(() => fit.fit()).observe(document.body);

// Copying drops the selection, so nothing shows that it worked: a word in the corner says so for a moment.
let copiedWord = 'Copied';
let noteTimer = 0;
function note(text) {
  const el = document.getElementById('note');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => el.classList.remove('on'), 1200);
}
function copy() {
  const text = term.getSelection();
  if (!text) return;
  send({ t: 'copy', d: text });
  term.clearSelection();
  note(copiedWord);
}
// Every paste goes through Sessionwright (also Shift+Insert and the browser's own): it asks before lines are pasted.
document.addEventListener('paste', e => {
  e.preventDefault();
  e.stopPropagation();
  send({ t: 'paste' });
}, true);

// The text's size: Ctrl with the wheel, Ctrl+Plus / Minus, Ctrl+0 for the usual one. Sessionwright keeps it.
function setSize(size, tell) {
  size = Math.max(8, Math.min(32, Math.round(size)));
  if (size === term.options.fontSize) return;
  term.options.fontSize = size;
  fit.fit();
  if (tell) send({ t: 'font', n: size });
}
document.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  setSize(term.options.fontSize + (e.deltaY < 0 ? 1 : -1), true);
}, { passive: false, capture: true });

term.attachCustomKeyEventHandler(e => {
  if (e.type !== 'keydown') return true;
  if (e.code === 'F11') { send({ t: 'fullscreen' }); return false; }
  // As in a remote desktop session: Ctrl+Alt+Left / Right go to the session before or after, Ctrl+Alt+Down shows all.
  if (e.ctrlKey && e.altKey && !e.shiftKey) {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { send({ t: 'switch', n: e.code === 'ArrowLeft' ? -1 : 1 }); return false; }
    if (e.code === 'ArrowDown') { send({ t: 'switcher' }); return false; }
  }
  if (e.ctrlKey && !e.altKey && !e.shiftKey) {
    if (e.code === 'Equal' || e.code === 'NumpadAdd') { setSize(term.options.fontSize + 1, true); return false; }
    if (e.code === 'Minus' || e.code === 'NumpadSubtract') { setSize(term.options.fontSize - 1, true); return false; }
    if (e.code === 'Digit0' || e.code === 'Numpad0') { setSize(DefaultSize, true); return false; }
    // As in Windows Terminal: Ctrl+C copies what is selected, and only without a selection is the terminal's own
    // (interrupt); Ctrl+V pastes (its old meaning, "the next key as it is", few use; Ctrl+Q does the same in vim).
    if (e.code === 'KeyC' && term.hasSelection()) { copy(); return false; }
    if (e.code === 'KeyV') { e.preventDefault(); send({ t: 'paste' }); return false; }
  }
  // With Shift too, as terminals on Linux have it.
  if (e.ctrlKey && e.shiftKey && !e.altKey) {
    if (e.code === 'KeyC') { copy(); return false; }
    if (e.code === 'KeyV') { send({ t: 'paste' }); return false; }
  }
  return true;
});
// The right button opens Sessionwright's menu (copy, paste and the rest): acting on it at once pasted by accident.
document.addEventListener('contextmenu', e => {
  e.preventDefault();
  send({ t: 'menu' });
});
term.onSelectionChange(() => send({ t: 'sel', v: term.hasSelection() }));

// Web addresses in what the server prints: underlined under the pointer, opened on this PC with Ctrl and a click (a
// plain click stays the terminal's, for selecting).
term.registerLinkProvider({
  provideLinks(y, callback) {
    const line = term.buffer.active.getLine(y - 1);
    const links = [];
    for (const match of (line ? line.translateToString(true) : '').matchAll(/https?:\/\/[^\s<>"'`]+/g)) {
      const url = match[0].replace(/[.,;:!?)\]]+$/, '');
      links.push({
        range: { start: { x: match.index + 1, y }, end: { x: match.index + url.length, y } }, text: url,
        activate: (event, text) => { if (event.ctrlKey) send({ t: 'link', d: text }); },
      });
    }
    callback(links.length > 0 ? links : undefined);
  },
});

// Files dropped on the terminal: handed to Sessionwright with their paths (a page alone sees only their names), which
// copies them to the server.
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files.length > 0) chrome.webview.postMessageWithAdditionalObjects({ t: 'files' }, e.dataTransfer.files);
});
chrome.webview.addEventListener('message', e => {
  const m = e.data;
  if (m.o) term.write(Uint8Array.from(atob(m.o), c => c.charCodeAt(0)));
  else if (m.p !== undefined) term.paste(m.p);
  else if (m.theme) {
    term.options.theme = m.theme;
    document.documentElement.style.setProperty('--bg', m.theme.background);
    document.documentElement.style.setProperty('--thumb', m.thumb);
    document.documentElement.style.setProperty('--fg', m.theme.foreground);
    document.documentElement.style.setProperty('--note', m.note);
    if (m.copied) copiedWord = m.copied;
    if (m.weight) term.options.fontWeight = m.weight;
    if (m.fontSize) setSize(m.fontSize, false);
  }
  else if (m.cmd === 'copy') copy();
  else if (m.ended !== undefined) document.body.classList.toggle('ended', m.ended);
  else if (m.cmd === 'selectAll') term.selectAll();
  else if (m.cmd === 'clear') term.clear();
  else if (m.cmd === 'size') setSize(m.n === 0 ? DefaultSize : term.options.fontSize + m.n, true);
  else if (m.focus) term.focus();
});
fit.fit();
term.focus();
send({ t: 'ready', c: term.cols, r: term.rows });
</script>
</body>
</html>
